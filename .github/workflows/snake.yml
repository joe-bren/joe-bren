name: profile widgets

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff4d00&color_dots=#ebedf0,#ffe0b2,#ffb000,#ff6a00,#d62800
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffb000&color_dots=#161b22,#4a1500,#a83200,#ff4d00,#ffb000

      - name: streak card
        run: python3 .github/scripts/streak.py "${{ github.repository_owner }}" dist/streak.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
